<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaySolutions - Payment Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .payment-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .payment-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }

        .payment-tab {
            flex: 1;
            padding: 15px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #999;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .payment-tab:hover {
            color: #667eea;
        }

        .payment-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .payment-method {
            display: none;
        }

        .payment-method.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        #card-element {
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            background: white;
        }

        #paypal-button-container {
            margin-top: 20px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <h1>Secure Payment</h1>
        <p class="subtitle">Choose your preferred payment method</p>

        <div class="payment-tabs">
            <button class="payment-tab active" data-tab="stripe">
                💳 Credit Card
            </button>
            <button class="payment-tab" data-tab="paypal">
                🅿️ PayPal
            </button>
            <button class="payment-tab" data-tab="square">
                ◻️ Square
            </button>
        </div>

        <!-- Stripe Payment Form -->
        <div id="stripe-payment" class="payment-method active">
            <form id="stripe-form">
                <div class="form-group">
                    <label for="amount">Amount (USD)</label>
                    <input type="number" id="stripe-amount" value="10.00" step="0.01" min="0.01" required>
                </div>
                <div class="form-group">
                    <label for="card-element">Card Details</label>
                    <div id="card-element"></div>
                </div>
                <button type="submit" class="submit-btn" id="stripe-submit">
                    Pay with Stripe
                </button>
            </form>
        </div>

        <!-- PayPal Payment Form -->
        <div id="paypal-payment" class="payment-method">
            <div class="form-group">
                <label for="paypal-amount">Amount (USD)</label>
                <input type="number" id="paypal-amount" value="10.00" step="0.01" min="0.01">
            </div>
            <div id="paypal-button-container"></div>
        </div>

        <!-- Square Payment Form -->
        <div id="square-payment" class="payment-method">
            <form id="square-form">
                <div class="form-group">
                    <label for="square-amount">Amount (USD)</label>
                    <input type="number" id="square-amount" value="10.00" step="0.01" min="0.01" required>
                </div>
                <div class="form-group">
                    <label for="square-card">Card Details</label>
                    <div id="square-card"></div>
                </div>
                <button type="submit" class="submit-btn" id="square-submit">
                    Pay with Square
                </button>
            </form>
        </div>

        <div id="message"></div>
    </div>

    <!-- Stripe JS -->
    <script src="https://js.stripe.com/v3/"></script>
    <!-- PayPal JS - Replace YOUR_PAYPAL_CLIENT_ID with actual client ID -->
    <script src="https://www.paypal.com/sdk/js?client-id=YOUR_PAYPAL_CLIENT_ID&currency=USD"></script>
    <!-- Square JS -->
    <script src="https://sandbox.web.squarecdn.com/v1/square.js"></script>

    <script src="/paysolutions.js"></script>
</body>
</html>
